<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --border: #e2e8f0;
    --radius: 10px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .hidden {
        display: none !important;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.5;
    }

    /* Wrapper Card for Form */
    #new-links {
        background: var(--card-bg);
        padding: 24px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-bottom: 28px;
    }

    #link-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    /* Grid layout adjustments for form elements */
    #link-form br {
        display: none; /* Hide old <br> elements */
    }

    #link-form label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 4px;
        display: block;
    }

    /* Span the link URL field across both columns */
    #link-form div:nth-child(5) {
        grid-column: span 2;
    }

    #link-form input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.95rem;
        background: #f1f5f9;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    #link-form input:focus {
        outline: none;
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Base Buttons */
    button {
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    /* Form Submit Button */
    #link-form button[type="submit"] {
        grid-column: span 2;
        background: var(--primary);
        color: white;
        font-weight: 600;
        padding: 12px;
        margin-top: 8px;
    }

    #link-form button[type="submit"]:hover {
        background: var(--primary-hover);
    }

    /* Category Filter Pills */
    #categories {
        margin-bottom: 24px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    #categories button {
        background: #e2e8f0;
        color: var(--text-muted);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.85rem;
    }

    #categories button:hover {
        background: #cbd5e1;
        color: var(--text-main);
    }

    /* Saved Link Cards */
    .linkAvailable {
        background: var(--card-bg);
        border: 1px solid var(--border);
        padding: 16px;
        margin-bottom: 12px;
        border-radius: var(--radius);
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow);
        transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .linkAvailable:hover {
        transform: translateY(-1px);
        border-color: #cbd5e1;
    }

    .link-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .title {
        font-weight: 600;
        font-size: 1.05rem;
        color: var(--text-main);
    }

    .url a {
        color: var(--primary);
        text-decoration: none;
        font-size: 0.9rem;
        word-break: break-all;
    }

    .url a:hover {
        text-decoration: underline;
    }

    /* Delete Button on Cards */
    .linkAvailable button {
        background: transparent;
        color: var(--danger);
        border: 1px solid #fecaca;
        padding: 6px 12px;
        font-size: 0.8rem;
    }

    .linkAvailable button:hover {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
    }
    </style>
</head>
<body>
    <div id="link-parent">
        <div id="new-links">
            <form id="link-form">
                <label for="newLinkTitle">Link title: </label>
                <input type="text" name="newLinkTitle" id="newLinkTitle" />
                <br>
                <label for="categoryLink">Link category: </label>
                <input type="text" name="categoryLink" id="categoryLink" />
                <br>
                <label for="newLink">Link</label>
                <input type="text" name="newLink" id="newLink" />
                <br>
                <button type="submit">Save</button>
            </form>

        </div>
        <div id="categories">

        </div>
        <div id="links">

        </div>
    </div>
    
    <script>

        async function deleteLink(linkId){
            const url = "api/delete_link.php";

                try{
                    const response = await fetch(url ,{
                        method : "POST",
                        headers : {
                            "Content-Type" : "application/json"
                        },
                        body: JSON.stringify({
                            id: linkId
                        })
                    });

                    const result = await response.json();

                    if(response.ok){//201
                        loadLinks();
                        
                    }

                }catch(error){

                }
        }

        function showCategory(categoryToShow){
            const linksAvailable = document.querySelectorAll(".linkAvailable");
            if(categoryToShow == "All"){
                linksAvailable.forEach(link =>{
                    if(link.classList.contains("hidden")){
                        link.classList.remove("hidden");
                    }
                    
                });

            }else{
                
                linksAvailable.forEach(link =>{
                    if(!link.classList.contains("hidden")){
                        link.classList.add("hidden");
                    }
                    
                });

                linksAvailable.forEach(link =>{
                    if(link.classList.contains(categoryToShow)){
                        link.classList.remove("hidden");
                    }
                    
            });

            }
            
  
        }

        function generateDashboardLinks(links, categories) {
            const linkContainer = document.querySelector("#links");
            const categoryContainer = document.querySelector("#categories");
            
            linkContainer.innerHTML = '';
            categoryContainer.innerHTML = '';

            // Render category filter buttons
            categories.forEach(category => {
                // Supports both string array ["Tech"] or object array [{category: "Tech"}]
                const catName = typeof category === 'object' ? category.category : category;
                
                const btn = document.createElement("button");
                btn.textContent = catName;
                btn.onclick = () => showCategory(`show-${catName}`);
                categoryContainer.appendChild(btn);
            });

            // "All" filter button
            const allBtn = document.createElement("button");
            allBtn.textContent = "All";
            allBtn.onclick = () => showCategory("All");
            categoryContainer.appendChild(allBtn);

            // Render link cards
            links.forEach(link => {
                const card = document.createElement("div");
                card.className = `show-${link.category} linkAvailable`;

                const infoDiv = document.createElement("div");
                infoDiv.className = "link-info";

                const titleDiv = document.createElement("div");
                titleDiv.className = "title";
                titleDiv.textContent = link.title;

                const urlDiv = document.createElement("div");
                urlDiv.className = "url";
                
                const anchor = document.createElement("a");
                anchor.href = link.url;
                anchor.target = "_blank"; // Opens in a new tab
                anchor.textContent = link.url;
                urlDiv.appendChild(anchor);

                infoDiv.appendChild(titleDiv);
                infoDiv.appendChild(urlDiv);

                const delBtn = document.createElement("button");
                delBtn.textContent = "Delete";
                delBtn.onclick = () => deleteLink(link.id);

                card.appendChild(infoDiv);
                card.appendChild(delBtn);

                linkContainer.appendChild(card);
            });
        }
        async function loadLinks(){

                const url = "api/get_links.php";

                try{
                    const response = await fetch(url ,{
                        method : "GET"
                    });

                    const result = await response.json();

                    if(response.ok){//200
                        generateDashboardLinks(result.links,result.categories);
                    }

                }catch(error){

                }

            }
        
        

        document.addEventListener("DOMContentLoaded",(event) => {

            const form = document.querySelector("#link-form");

            form.addEventListener("submit", async function(e){
                e.preventDefault();
   
                const linkTitle = document.querySelector("#newLinkTitle").value;
                const linkCategory = document.querySelector("#categoryLink").value;
                const linkUrl = document.querySelector("#newLink").value;


                const url = "api/save_link.php";

                try {

                    const response = await fetch(url,{
                        method : "POST",
                        headers : {
                            "Content-Type" : "application/json"
                        },
                        body : JSON.stringify({
                            linkTitle : linkTitle,
                            linkCategory : linkCategory,
                            linkUrl : linkUrl,
                        })
                    });

                    const result = await response.json();
                    
                    if(response.ok){
                        console.log("ADDED");
                        loadLinks();
                    }else{

                    }


                    
                } catch (error) {
                    throw new Error(`Response status: ${response.status}`);
                }

            });
           

             
            
            loadLinks();
        });
    </script>
</body>
</html>
